services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set in .env}
      MYSQL_DATABASE: clucknet
      MYSQL_USER: cluckuser
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:?Set in .env}
    ports: ["127.0.0.1:3308:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
  influxdb:
    image: influxdb:2.7-alpine
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD:?Set in .env}
      DOCKER_INFLUXDB_INIT_ORG: cluckorg
      DOCKER_INFLUXDB_INIT_BUCKET: telemetry
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:?Set in .env}
      DOCKER_INFLUXDB_INIT_RETENTION: 30d
    ports: ["127.0.0.1:8086:8086"]
    volumes: ["influxdb_data:/var/lib/influxdb2", "influxdb_config:/etc/influxdb2"]
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
  mosquitto:
    image: eclipse-mosquitto:2
    ports: ["127.0.0.1:1883:1883"]
    volumes: ["./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro"]
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-t", "healthcheck", "-m", "ok"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: .
    ports: ["8080:8080"]
    environment:
      DATABASE_URL: jdbc:mysql://mysql:3306/clucknet?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DATABASE_USERNAME: cluckuser
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set in .env}
      HIBERNATE_DDL_AUTO: update
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:?Set in .env}
      INFLUXDB_ORG: cluckorg
      INFLUXDB_BUCKET: telemetry
      AWS_IOT_BROKER_URL: tcp://mosquitto:1883
      AWS_IOT_CLIENT_ID: clucknet-local
      AWS_IOT_SSL_ENABLED: "false"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set in .env}
    depends_on:
      mysql: {condition: service_healthy}
      influxdb: {condition: service_healthy}
      mosquitto: {condition: service_healthy}
volumes:
  mysql_data:
  influxdb_data:
  influxdb_config:
