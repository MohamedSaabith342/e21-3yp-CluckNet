apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: clucknet
spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend
          image: mohamedsaabith342/clucknet-backend:v2

          ports:
            - containerPort: 8080

          envFrom:
            - configMapRef:
                name: backend-config

            - secretRef:
                name: backend-secret

          startupProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 10
            failureThreshold: 30

          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 10

          livenessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 20

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi

          volumeMounts:
            - name: iot-certs
              mountPath: /app/certs
              readOnly: true

            - name: rds-ca
              mountPath: /app/rds
              readOnly: true

            - name: firebase-credentials
              mountPath: /app/firebase
              readOnly: true

      volumes:
        - name: iot-certs
          secret:
            secretName: aws-iot-certs

        - name: rds-ca
          configMap:
            name: rds-truststore

        - name: firebase-credentials
          secret:
              secretName: firebase-secret